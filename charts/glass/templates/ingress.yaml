{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: {{ include "glass.name" . }}
    {{- with .Values.ingress.annotations }}
    annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
spec:
    {{- with .Values.ingress.className }}
    ingressClassName: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.tlsSecretName }}
    tls:
        - hosts: [{{ required "ingress.host is required" $.Values.ingress.host | quote }}]
          secretName: {{ . }}
    {{- end }}
    rules:
        - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
          http:
              paths:
                  {{- range list "/api/v1" "/auth/callback" "/sync" }}
                  - path: {{ . }}
                    pathType: Prefix
                    backend:
                        service:
                            name: {{ include "glass.name" $ }}
                            port:
                                name: http
                  {{- end }}
{{- end }}
