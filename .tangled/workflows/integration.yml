when:
    - event: push
      branch: [main]
    - event: pull_request
      branch: [main]
    - event: manual
engine: microvm
image: nixos
dependencies:
    - nodejs_24
    - git
    - chromium
    - openssl
virtualisation:
    docker: true
steps:
    - name: Install locked dependencies
      command: npm run install:all
    - name: Verify development password encoding
      command: node --test dev/password-hash.test.mjs
    - name: Generate isolated development identities
      command: node dev/init.mjs
    - name: Start stock Authelia, CouchDB and Glass
      command: |
          if docker compose --env-file dev/.local/compose.env -f dev/compose.yaml up --build -d --wait; then
              exit 0
          else
              status=$?
              docker compose --env-file dev/.local/compose.env -f dev/compose.yaml ps --all
              docker compose --env-file dev/.local/compose.env -f dev/compose.yaml logs --no-color --tail 100 authelia
              docker inspect --format '{{json .State.Health}}' glass-dev-authelia-1
              exit "$status"
          fi
    - name: Exercise browser login and two-user replication
      command: GLASS_CHROMIUM="$(command -v chromium)" GLASS_INTEGRATION=1 GLASS_TEST_RESTART=1 npm run test:integration
