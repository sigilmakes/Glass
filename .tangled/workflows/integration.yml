when:
    - event: push
      branch: [main]
    - event: pull_request
      branch: [main]
    - event: manual
engine: microvm
image: nixos
dependencies:
    - nodejs_24
    - git
    - chromium
    - openssl
virtualisation:
    docker: true
steps:
    - name: Install locked dependencies
      command: npm run install:all
    - name: Generate isolated development identities
      command: node dev/init.mjs
    - name: Start stock Authelia, CouchDB and Glass
      command: docker compose --env-file dev/.local/compose.env -f dev/compose.yaml up --build -d --wait
    - name: Exercise browser login and two-user replication
      command: GLASS_CHROMIUM="$(command -v chromium)" GLASS_INTEGRATION=1 GLASS_TEST_RESTART=1 npm run test:integration
