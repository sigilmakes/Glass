name: glass-dev
services:
    couchdb:
        restart: unless-stopped
        user: "5984:5984"
        image: couchdb:3.5.1
        environment:
            COUCHDB_USER: glass-operator
            COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD:?Run node dev/init.mjs first}
        volumes:
            - couchdb:/opt/couchdb/data
            - couchdb-config:/opt/couchdb/etc/local.d
            - ./couchdb.ini:/opt/couchdb/etc/local.d/10-single-node.ini:ro
        healthcheck:
            test: [CMD, curl, -fsS, http://localhost:5984/_up]
            interval: 5s
            timeout: 3s
            retries: 30
    authelia:
        restart: unless-stopped
        image: authelia/authelia:4.39.24
        command: [authelia, --config, /config/configuration.yml, --config.experimental.filters, template]
        volumes:
            - ./.local:/secrets:ro
            - ./authelia.yml:/config/configuration.yml:ro
            - authelia:/data
        healthcheck:
            test: [CMD, wget, -q, --spider, http://127.0.0.1:9091/api/health]
            interval: 5s
            timeout: 3s
            retries: 30
    gateway:
        restart: unless-stopped
        build:
            context: ..
            dockerfile: server/Dockerfile
        environment:
            HOST: 0.0.0.0
            PORT: "3000"
            PUBLIC_URL: https://glass.localhost:8443
            AUTH_ISSUER: https://auth.glass.localhost:8443
            AUTH_AUTHZ_URL: http://authelia:9091/api/authz/forward-auth
            AUTH_CLIENT_ID: glass
            AUTH_AUDIENCE: https://glass.localhost:8443
            COUCHDB_URL: http://couchdb:5984
            COUCHDB_ADMIN_USERNAME: glass-operator
            COUCHDB_ADMIN_PASSWORD_FILE: /secrets/couchdb-admin-password
            COUCHDB_PROXY_SECRET_FILE: /secrets/couchdb-proxy-secret
            SQLITE_PATH: /data/glass.sqlite
            NODE_EXTRA_CA_CERTS: /secrets/tls.crt
        volumes:
            - ./.local/couchdb-admin-password:/secrets/couchdb-admin-password:ro
            - ./.local/couchdb-proxy-secret:/secrets/couchdb-proxy-secret:ro
            - ./.local/tls.crt:/secrets/tls.crt:ro
            - gateway:/data
        depends_on:
            couchdb:
                condition: service_healthy
        healthcheck:
            test: [CMD, node, -e, "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            interval: 5s
            timeout: 3s
            retries: 30
    edge:
        restart: unless-stopped
        image: caddy:2.10.2-alpine
        ports:
            - 127.0.0.1:8443:8443
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - ./.local:/secrets:ro
            - caddy:/data
        networks:
            default:
                aliases: [glass.localhost, auth.glass.localhost]
        depends_on: [gateway, authelia]
volumes:
    couchdb:
    couchdb-config:
    gateway:
    authelia:
    caddy:
